<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1400" viewBox="0 0 1440 1400" role="img" aria-labelledby="title desc"><title id="title">卷卷V2.7 Agent架构</title><desc id="desc">单助手统一理解，保留天气与工具分支；模型返回结构化结果，日程变更与记忆收录必须经过用户确认和程序校验。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8494aa"/></marker><style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif}.title{font-size:24px;font-weight:600;fill:#23354e}.body{font-size:20px;fill:#526780}.label{font-size:17px;fill:#647a94;paint-order:stroke;stroke:#f8faff;stroke-width:7px;stroke-linejoin:round}</style></defs><rect width="1440" height="1400" fill="#f8faff"/><text x="70" y="58" font-size="34" font-weight="700" fill="#23354e">卷卷 V2.7 · Agent架构</text><text x="70" y="96" font-size="21" fill="#637a95">一个助手统一理解，程序控制工具，用户确认真实变更</text><path d="M720 206 V244" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M720 350 V390" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M545 428 H420" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="482" y="414" class="label" text-anchor="middle">命中天气</text><path d="M720 466 V507" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="772" y="491" class="label" text-anchor="middle">其他消息</text><path d="M895 545 H1020" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="956" y="529" class="label" text-anchor="middle">含公开链接</text><path d="M720 583 V629" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="720" y="611" class="label" text-anchor="middle">无新链接或已备资料</text><path d="M1195 583 V607 H800 V629" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M895 672 H1020" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="956" y="656" class="label" text-anchor="middle">需要搜索</text><path d="M1020 719 H946 V718 H895" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="958" y="754" class="label" text-anchor="middle">带回来源</text><path d="M720 735 V788" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M545 826 H420" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="481" y="811" class="label" text-anchor="middle">失败</text><path d="M720 864 V892 H245 V921" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M720 892 V921" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M720 892 H1195 V921" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M720 1027 V1084" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="781" y="1060" class="label" text-anchor="middle">用户确认</text><path d="M1195 1027 V1084" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><text x="1256" y="1060" class="label" text-anchor="middle">用户核对</text><path d="M720 1190 V1242" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M1195 1190 V1242" fill="none" stroke="#8494aa" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="545" y="130" width="350" height="76" rx="16" fill="#ffffff" stroke="#cbd7e7" stroke-width="1.5"/><text x="720" y="163" text-anchor="middle" class="title">用户消息</text><text x="720" y="191" text-anchor="middle" class="body">统一聊天入口</text></g><g><rect x="545" y="244" width="350" height="106" rx="16" fill="#edf5ff" stroke="#cbd7e7" stroke-width="1.5"/><text x="720" y="277" text-anchor="middle" class="title">准备有限上下文</text><text x="720" y="305" text-anchor="middle" class="body">最近对话、候选与相关事务</text><text x="720" y="332" text-anchor="middle" class="body">按授权选取个人记忆</text></g><g><rect x="545" y="390" width="350" height="76" rx="16" fill="#ffffff" stroke="#cbd7e7" stroke-width="1.5"/><text x="720" y="423" text-anchor="middle" class="title">规则分支判断</text><text x="720" y="451" text-anchor="middle" class="body">天气直接查询，其余进入AI</text></g><g><rect x="70" y="384" width="350" height="94" rx="16" fill="#f1f6fb" stroke="#cbd7e7" stroke-width="1.5"/><text x="245" y="417" text-anchor="middle" class="title">天气工具</text><text x="245" y="445" text-anchor="middle" class="body">满足天气规则时由程序查询</text><text x="245" y="472" text-anchor="middle" class="body">不调用模型，结果回到界面</text></g><g><rect x="545" y="507" width="350" height="76" rx="16" fill="#ffffff" stroke="#cbd7e7" stroke-width="1.5"/><text x="720" y="540" text-anchor="middle" class="title">云端或自配路径</text><text x="720" y="568" text-anchor="middle" class="body">云端先校验请求与预占额度</text></g><g><rect x="70" y="507" width="350" height="104" rx="16" fill="#f6f8fc" stroke="#cbd7e7" stroke-width="1.5"/><text x="245" y="540" text-anchor="middle" class="title">Redis保存什么？</text><text x="245" y="568" text-anchor="middle" class="body">公共额度、请求状态、卡余额</text><text x="245" y="595" text-anchor="middle" class="body">不是日程与个人记忆数据库</text></g><g><rect x="1020" y="507" width="350" height="76" rx="16" fill="#f1f6fb" stroke="#cbd7e7" stroke-width="1.5"/><text x="1195" y="540" text-anchor="middle" class="title">公开链接读取</text><text x="1195" y="568" text-anchor="middle" class="body">有链接先取正文，再交给模型</text></g><g><rect x="545" y="629" width="350" height="106" rx="16" fill="#eeeaff" stroke="#c4b9ed" stroke-width="1.5"/><text x="720" y="662" text-anchor="middle" class="title">同一个模型统一理解</text><text x="720" y="690" text-anchor="middle" class="body">聊天、规划、事务共用合同</text><text x="720" y="717" text-anchor="middle" class="body">不额外调用分类模型</text></g><g><rect x="1020" y="645" width="350" height="94" rx="16" fill="#f1f6fb" stroke="#cbd7e7" stroke-width="1.5"/><text x="1195" y="678" text-anchor="middle" class="title">受限搜索工具</text><text x="1195" y="706" text-anchor="middle" class="body">模型提出research请求</text><text x="1195" y="733" text-anchor="middle" class="body">程序搜索，最多一轮再回答</text></g><g><rect x="545" y="788" width="350" height="76" rx="16" fill="#edf5ff" stroke="#cbd7e7" stroke-width="1.5"/><text x="720" y="821" text-anchor="middle" class="title">校验结构并分发结果</text><text x="720" y="849" text-anchor="middle" class="body">按结果类型进入对应流程</text></g><g><rect x="70" y="782" width="350" height="94" rx="16" fill="#fff4e7" stroke="#e4cba7" stroke-width="1.5"/><text x="245" y="815" text-anchor="middle" class="title">失败或取消出口</text><text x="245" y="843" text-anchor="middle" class="body">各阶段均可停止并明确提示</text><text x="245" y="870" text-anchor="middle" class="body">拒绝无效结果，不执行任务</text></g><g><rect x="70" y="921" width="350" height="106" rx="16" fill="#ffffff" stroke="#cbd7e7" stroke-width="1.5"/><text x="245" y="954" text-anchor="middle" class="title">回答、追问或本地查询</text><text x="245" y="982" text-anchor="middle" class="body">回答直接展示</text><text x="245" y="1009" text-anchor="middle" class="body">查询由程序读取本地记录</text></g><g><rect x="545" y="921" width="350" height="106" rx="16" fill="#ffffff" stroke="#cbd7e7" stroke-width="1.5"/><text x="720" y="954" text-anchor="middle" class="title">事务候选</text><text x="720" y="982" text-anchor="middle" class="body">创建、修改、删除等操作</text><text x="720" y="1009" text-anchor="middle" class="body">形成待确认卡，不直接执行</text></g><g><rect x="1020" y="921" width="350" height="106" rx="16" fill="#ffffff" stroke="#cbd7e7" stroke-width="1.5"/><text x="1195" y="954" text-anchor="middle" class="title">个人记忆候选</text><text x="1195" y="982" text-anchor="middle" class="body">整理为分类条目</text><text x="1195" y="1009" text-anchor="middle" class="body">待用户核对，不直接收录</text></g><g><rect x="545" y="1084" width="350" height="106" rx="16" fill="#e9f7ef" stroke="#aacdb7" stroke-width="1.5"/><text x="720" y="1117" text-anchor="middle" class="title">明确确认与业务校验</text><text x="720" y="1145" text-anchor="middle" class="body">核对目标范围、编号和版本</text><text x="720" y="1172" text-anchor="middle" class="body">保留重复执行与变更保护</text></g><g><rect x="1020" y="1084" width="350" height="106" rx="16" fill="#e9f7ef" stroke="#aacdb7" stroke-width="1.5"/><text x="1195" y="1117" text-anchor="middle" class="title">用户核对并确认保存</text><text x="1195" y="1145" text-anchor="middle" class="body">可以编辑、改分类与删除</text><text x="1195" y="1172" text-anchor="middle" class="body">只保存确认后的记忆</text></g><g><rect x="545" y="1242" width="825" height="78" rx="16" fill="#edf5ff" stroke="#cbd7e7" stroke-width="1.5"/><text x="957.5" y="1275" text-anchor="middle" class="title">浏览器本地IndexedDB</text><text x="957.5" y="1303" text-anchor="middle" class="body">按动作提交业务变更，保存结果；日程、记忆、积分和宠物仍在本地</text></g><text x="70" y="1370" font-size="18" fill="#637a95">已删除：聊天、规划、事务的模式路由。仍保留：规则分支、工具选择、结果分发与执行校验。</text></svg>